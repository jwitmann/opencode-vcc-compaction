# opencode-vcc-port configuration
# Probe workspace promoted to a real project (2026-11-19). No build
# toolchain exists (no root package.json, no CI, probe-plugin has no
# scripts — verified by running ls + scaffold trial-run), so the gate
# cannot run typecheck/tests; require_review carries enforcement.

profile: standard

commands:
  typecheck: "node --check probe-plugin/index.ts" # verified by running: passes on node v24.22.3
  test: "node scripts/verify-evidence.mjs" # evidence gate: JSONC configs parse + JSONL lines version-tagged

protect:
  - ".env"
  - ".env.*"
  - "**/.env"
  - "**/.env.*"
  - "**/node_modules/**"
  - "**/vendor/**"

exclude: []

rules:
  mode: append
  files:
    - .dev-framework/hardening.md

gate:
  run_typecheck: true # node --check on the probe stub (verified by running)
  run_tests: true # scripts/verify-evidence.mjs (verified by running: pass + mutation-fail)
  block_on_failure: true
  skip_unchanged: true
  scope: all
  lint_changed: false # no linter configured
  # standard default: sessions that changed files must produce a
  # peer-review artifact (.dev-framework/review.md).
  require_review: true
  timeout: 300
  max_blocks: 3

# Optional: pre-flight task list. When set, edit tools are denied
# (standard/strict) until the agent writes its findings to
# .dev-framework/preflight.md. Use for work that
# must establish baseline state/knowledge before editing.
# preflight:
#   - "Summarize the current state of the component you will change"
#   - "Record the baseline metrics this work will be judged against"

on_edit:
  format: false # no formatter configured
  lint: false # no linter configured
